name: Publicar ServiceDesk para Windows
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/distribuicao-atualizacoes, feat/configuracoes-atualizador, feat/segundo-plano-windows, feat/instalador-windows]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar contrato de mensagens Chatwoot
        shell: pwsh
        run: |
          dotnet run --project Tests/ChatwootContract/ChatwootContract.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/Scripts/Exportar-CamposConversa.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Testar leitura no Windows PowerShell 5.1
        shell: powershell
        run: ./Scripts/Testar-LeituraCampos.ps1
      - uses: microsoft/setup-msbuild@v2
      - name: Preparar assinatura de teste para PR
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./Scripts/Preparar-AssinaturaCI.ps1 -Teste
      - name: Preparar certificado do publicador
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SERVICEDESK_CERTIFICATE_PFX_BASE64: ${{ secrets.SERVICEDESK_CERTIFICATE_PFX_BASE64 }}
          SERVICEDESK_CERTIFICATE_PASSWORD: ${{ secrets.SERVICEDESK_CERTIFICATE_PASSWORD }}
        run: ./Scripts/Preparar-AssinaturaCI.ps1
      - name: Compilar aplicativo independente
        timeout-minutes: 10
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER.0"
          msbuild ServiceDesk.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:EnableMsixTooling=false /p:EnableWinAppRunSupport=false /p:PublishSingleFile=false /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:Version=$version /p:AssemblyVersion=$version /p:FileVersion=$version /p:PublishDir="$env:GITHUB_WORKSPACE\publish\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path publish/ServiceDesk.exe)) { throw "Executável não foi gerado." }
          $output = "bin/x64/Release/net10.0-windows10.0.26100.0/win-x64"
          Copy-Item "$output/ServiceDesk.pri" publish/ServiceDesk.pri -Force
          Copy-Item "$output/*.xbf" publish/ -Force
          New-Item -ItemType Directory -Path publish/Assets -Force | Out-Null
          Copy-Item Assets/* publish/Assets/ -Force
          @"
          ServiceDesk $version - Windows x64
          Extraia todo o ZIP em uma nova pasta e abra ServiceDesk.exe.
          Feche a versão antiga antes de abrir a nova. Use o novo executável ou crie um atalho para ele.
          A configuração em %USERPROFILE%\.servicedesk será preservada.
          A versão portátil exibe alertas dentro do aplicativo; notificações do Windows podem não estar disponíveis.
          Use Configurações > Sobre para verificar e instalar novas versões.
          "@ | Set-Content publish/LEIA-ME.txt -Encoding utf8
          $env:SERVICEDESK_DIAGNOSTICO = "1"
          $process = Start-Process -FilePath "$env:GITHUB_WORKSPACE\publish\ServiceDesk.exe" -WorkingDirectory "$env:GITHUB_WORKSPACE\publish" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Get-Content "$env:TEMP/ServiceDesk-inicializacao.log" -ErrorAction SilentlyContinue
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 10 TimeCreated, Message | Format-List
            throw "ServiceDesk encerrou ao iniciar (código $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id
          powershell.exe -MTA -NoProfile -ExecutionPolicy Bypass -File ./Scripts/Testar-Metricas.ps1 -PackagePath "$env:GITHUB_WORKSPACE/publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Scripts/Testar-SegundoPlano.ps1 -PackagePath "$env:GITHUB_WORKSPACE/publish"
          & ./Scripts/Testar-Atualizador.ps1 -PackagePath "$env:GITHUB_WORKSPACE/publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Scripts/Assinar-ArquivosCI.ps1 -Arquivos @('publish/ServiceDesk.exe', 'publish/ServiceDesk.dll')
          Compress-Archive -Path publish/* -DestinationPath ServiceDesk-win-x64.zip
          Get-FileHash ServiceDesk-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ServiceDesk-win-x64.zip" } | Set-Content SHA256SUMS.txt
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Compilar instalador por usuário
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 não encontrado no runner." }
          $assinador = '"' + $env:SIGNTOOL_PATH + '" sign /s My /sha1 ' + $env:SIGNING_THUMBPRINT + ' /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f'
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DPublishDir=$env:GITHUB_WORKSPACE\publish" '/DSignedBuild' "/SServiceDeskSign=$assinador" Installer/ServiceDesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-output/ServiceDesk-Setup-win-x64.exe .
          & ./Scripts/Assinar-ArquivosCI.ps1 -SomenteVerificar -Arquivos @('ServiceDesk-Setup-win-x64.exe')
          Get-FileHash ServiceDesk-Setup-win-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ServiceDesk-Setup-win-x64.exe" } | Add-Content SHA256SUMS.txt
      - name: Testar instalação e desinstalação
        shell: pwsh
        run: ./Scripts/Testar-Instalador.ps1 -InstallerPath "$env:GITHUB_WORKSPACE/ServiceDesk-Setup-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceDesk-win-x64
          path: |
            ServiceDesk-win-x64.zip
            ServiceDesk-Setup-win-x64.exe
            SHA256SUMS.txt
            ServiceDesk-Publicador.cer
      - name: Disponibilizar download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Instalador para Windows x64: baixe ServiceDesk-Setup-win-x64.exe e execute. Instala no perfil do usuário, sem Git, Visual Studio ou .NET instalado. O ZIP portátil continua disponível como alternativa.
          
          Inclui exportação do histórico com imagens, vídeos e áudios originais, Configurações com instalação de atualizações, execução em segundo plano e início com Windows.
          Áudio e vídeo não são transcritos ou convertidos automaticamente.
          Configurações existentes no perfil do Windows são preservadas. Notificações do Windows podem não estar disponíveis na versão portátil; os alertas dentro do app permanecem.
          Aplicativo, instalador e desinstalador assinados por Rafael Stolf Silva com certificado próprio. O certificado público acompanha esta release; a confiança local não elimina possíveis avisos do SmartScreen.
          "@ | Set-Content release-notes.txt -Encoding utf8
          gh release create "v$env:RELEASE_VERSION" ServiceDesk-win-x64.zip ServiceDesk-Setup-win-x64.exe SHA256SUMS.txt ServiceDesk-Publicador.cer --title "ServiceDesk $env:RELEASE_VERSION" --notes-file release-notes.txt --target "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remover certificado privado do runner
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -DeleteKey -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\Root\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item "$env:RUNNER_TEMP/servicedesk-signing" -Recurse -Force -ErrorAction SilentlyContinue
